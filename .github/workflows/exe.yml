name: Windows exe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name Baskan app.py
      - run: Rename-Item dist\Baskan.exe "Başkan.exe"
      - uses: actions/upload-artifact@v4
        with: {name: Baskan-exe, path: dist/*.exe}
      - run: gh release upload son "dist/Başkan.exe" --clobber
        env: {GH_TOKEN: "${{ github.token }}"}
